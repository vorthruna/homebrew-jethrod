name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit + lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: mutation check (the pairwise suite must catch every re-injected bug)
        if: matrix.python == '3.13'
        run: python tests/mutate.py
      - name: install as a package (the pipx path)
        run: python -m pip install .
      - run: jethrod --version
      - run: jethrod selftest
      - name: offline check against the saved feed
        shell: bash
        env:
          JETHROD_FEED: file://${{ github.workspace }}/tests/feed_2026-11-13.json
          JETHROD_DESKTOP: "off"
        run: jethrod check | tee out.txt && grep -q "none in North America" out.txt
      - name: live tour feed + live site
        shell: bash
        run: |
          jethrod status || [ $? -eq 3 ]   # 3 = daemon not running, expected here
          jethrod site --recent

      - name: "windows: toast + startup service round-trip"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          jethrod test-alert
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::toast unavailable on this headless runner" }
          jethrod install-service
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\jethrod.lnk"
          if (-not (Test-Path $lnk)) { Write-Error "no startup shortcut"; exit 1 }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "shortcut -> $($sc.TargetPath) $($sc.Arguments)"
          if ($sc.TargetPath -notmatch 'pythonw\.exe$') { Write-Error "not windowless"; exit 1 }
          $log = "$env:LOCALAPPDATA\jethrod\jethrod.log"
          for ($i = 0; $i -lt 45 -and -not (Select-String -Quiet -Path $log -Pattern 'on the books' -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          Get-Content $log -Tail 5
          if (-not (Select-String -Quiet -Path $log -Pattern 'on the books')) { Write-Error "daemon never checked"; exit 1 }
          jethrod status
          if ($LASTEXITCODE -ne 0) { Write-Error "status says not running"; exit 1 }
          jethrod uninstall-service
          if (Test-Path $lnk) { Write-Error "shortcut not removed"; exit 1 }
          $global:LASTEXITCODE = 0

  systemd:
    # The real hardened system unit under real systemd: Type=notify readiness,
    # DynamicUser + StateDirectory, reload (SIGHUP), watchdog, clean stop.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install system-wide like a user would
        run: |
          sudo python3 -m pip install --break-system-packages . || sudo python3 -m pip install .
          command -v jethrod
          sudo ln -sf "$(command -v jethrod)" /usr/local/bin/jethrod 2>/dev/null || true
          /usr/local/bin/jethrod --version
          man -l jethrod.1 >/dev/null
      - name: systemd-analyze verify
        run: |
          sudo install -Dm644 contrib/systemd/jethrod.service /etc/systemd/system/jethrod.service
          systemd-analyze verify /etc/systemd/system/jethrod.service
          sed 's|%h/.local/bin/jethrod|/usr/local/bin/jethrod|' contrib/systemd/jethrod.user.service > /tmp/jethrod.service
          systemd-analyze verify /tmp/jethrod.service
          systemd-analyze security --offline=yes /etc/systemd/system/jethrod.service | tail -1
      - name: start, reload, watchdog, stop
        run: |
          sudo mkdir -p /etc/systemd/system/jethrod.service.d
          printf '[Service]\nWatchdogSec=20s\n' | sudo tee /etc/systemd/system/jethrod.service.d/ci.conf
          sudo systemctl daemon-reload
          sudo systemctl start jethrod          # blocks until READY=1 (Type=notify)
          systemctl is-active jethrod
          sleep 25                              # longer than WatchdogSec: pings must work
          systemctl is-active jethrod
          systemctl show jethrod -p StatusText -p NRestarts
          test "$(systemctl show jethrod -p NRestarts --value)" = 0
          sudo systemctl reload jethrod
          sleep 2
          sudo systemctl stop jethrod
          journalctl -u jethrod --no-pager -o short-precise | tail -20
          journalctl -u jethrod --no-pager | grep -q "reloaded"
          journalctl -u jethrod --no-pager | grep -q "stopping"
          test -f /var/lib/private/jethrod/seen.json
      - name: sysvinit script syntax
        run: sh -n contrib/sysvinit/jethrod && bash -n contrib/openrc/jethrod
